[package]
name = "forensiq-engine"
version = "0.1.0"
edition = "2021"
authors = ["ForensiqAI <dev@forensiq.ai>"]
description = "High-performance Rust forensic engine for blockchain analysis"

[dependencies]
tokio = { version = "1.28", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "gzip", "brotli", "rustls-tls", "stream"] }
petgraph = "0.6"
rayon = "1.7"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
hex = "0.4"
futures = "0.3"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.28", features = ["macros", "rt"] }
criterion = "0.4"
